<div class="author">
  <img width="30" class="author-image" src="{{ hugo.Data.author.image | relURL }}" alt="{{ hugo.Data.author.name }}" />
  <span class="author-name">{{ hugo.Data.author.name }}</span>
  <span class="author-divider"></span>
  <span class="author-date">{{ dateFormat "January 2, 2006" .Date }}</span>
</div>
